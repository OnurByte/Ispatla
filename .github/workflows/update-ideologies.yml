name: Update ideology dataset

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run ideologies:update
      - run: bun run ideologies:validate
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update ideology dataset"
          branch: automation/update-ideologies
          delete-branch: true
          title: "chore: update ideology dataset"
          body: "Weekly Wikipedia + Wikidata ideology catalog refresh."
